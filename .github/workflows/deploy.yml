name: Deploy

on:
  push:
    branches:
      - main
      - github-page-workflow
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure frontend deployment
        run: |
          if [ -z "${PUBLIC_URL}" ]; then
            echo "PUBLIC_URL=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_URL=${PUBLIC_URL}" >> "$GITHUB_ENV"
          fi
          if [ -z "${REACT_APP_API_BASE}" ]; then
            echo "REACT_APP_API_BASE repository variable is required for deployed builds." >&2
            exit 1
          fi
          echo "REACT_APP_API_BASE=${REACT_APP_API_BASE}" >> "$GITHUB_ENV"
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          REACT_APP_API_BASE: ${{ vars.REACT_APP_API_BASE }}

      - name: Run frontend tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Add single-page app fallback
        run: cp build/index.html build/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
