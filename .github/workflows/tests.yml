name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -v
      - name: Generate Backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: backend/
          format: spdx-json
          output-file: pao-backend-sbom.spdx.json
          upload-artifact: false

      - name: Upload Backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: pao-backend-sbom
          path: pao-backend-sbom.spdx.json

      - name: Attest Backend SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: pao-backend-sbom.spdx.json

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest
        run: npm run test:ci
      - name: Generate Frontend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: frontend/
          format: spdx-json
          output-file: pao-frontend-sbom.spdx.json
          upload-artifact: false

      - name: Upload Frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: pao-frontend-sbom
          path: pao-frontend-sbom.spdx.json

      - name: Attest Frontend SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4
        with:
          subject-path: pao-frontend-sbom.spdx.json
